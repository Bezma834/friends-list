version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: friends-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: friendsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  graphql-engine:
    image: hasura/graphql-engine:v2.38.0
    container_name: friends-hasura
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/friendsdb
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_JWT_SECRET: '{"type": "HS256", "key": "supersecretjwtkeyforhasuraandexpressauthserver123!"}'

volumes:
  db_data:
